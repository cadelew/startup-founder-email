[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-founder-email"
version = "0.1.0"
description = "A readable founder outreach data pipeline."
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Caden Lewis" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0.0",
]
enrichment = [
  "dnspython>=2.0.0",
]

[project.scripts]
startup-founder-email-api = "startup_founder_email.api_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
